name: converter_mobile
description: A privacy-first mobile file converter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  open_filex: ^4.6.0
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  pdfx: ^2.8.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
